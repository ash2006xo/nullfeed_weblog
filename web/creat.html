<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New post</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav>
        <div class="container nav-inner"><a href="/" class="brand"><span class="brand-mark">∿</span> nullfeed</a>
            <div class="links" id="nav-links"></div>
        </div>
    </nav>
    <main class="container create-main"><a class="back-link" href="/">← Back to feed</a>
        <section class="create-intro"><span class="section-kicker">New entry</span>
            <h1>What's on your mind?</h1>
            <p>Write it down</p>
        </section>
        <form id="create-form" class="create-form card">
            <div class="field"><label for="title">Title</label><input id="title" maxlength="200"
                    placeholder="Give your post a name…" required></div>
            <div class="field"><label for="content">Content</label><textarea id="content" maxlength="50000"
                    placeholder="Start writing…" required></textarea>
                <div class="field"><label for="image">Cover image <span class="optional">optional</span></label><label
                        class="upload-box" for="image"><span class="upload-icon">↑</span><span><strong>Choose an
                                image</strong><small>JPG, PNG, GIF or WebP · max 5 MB</small></span><input id="image"
                            type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label>
                    <div id="image-preview" class="image-preview"></div>
                    <p id="image-status" class="meta"></p>
                </div>
                <div class="privacy-box"><label class="switch-row"><span><strong>Private post</strong><small>Only you
                                and people you choose can read it.</small></span><input id="is-private"
                            type="checkbox"><span class="switch"></span></label>
                    <div id="sharing-fields" class="hidden share-fields"><label for="share-with">Share
                            with</label><input id="share-with" placeholder="alice, bob"><small>Enter usernames separated
                            by commas.</small></div>
                </div>
                <p class="error" id="error-msg" style="display:none;"></p>
                <div class="create-footer"><span class="meta">You can delete your post later, but it cannot be
                        edited.</span><button type="submit" class="btn btn-large">Publish post <span>→</span></button>
                </div>
        </form>
    </main>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/create.js"></script>
</body>

</html>
