<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your weblog platform">
  <title>nullfeed</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="home-page">
  <nav>
    <div class="container nav-inner"><a href="/" class="brand"><span class="brand-mark">∿</span> nullfeed</a>
      <div class="links" id="nav-links"></div>
    </div>
  </nav>
  <main class="container home-main">
    <section class="hero">
      <div class="hero-glow"></div>
      <p class="eyebrow">A little corner for your thoughts</p>
      <h1>Feed the void<br><em>Leave a signal!</em></h1>
      <p class="hero-copy">Write and share your story.</p>
      <div class="hero-actions"><a class="btn btn-large" href="/create.html">START HERE</a><span class="hero-note">You
          got an idea?</span></div>
    </section>

    <section class="feed-toolbar">
      <div><span class="section-kicker">Latest from nullfeed</span>
        <h2>Explore the feed<span id="post-count" class="post-count"></span></h2>
      </div>
      <div class="feed-tools">
        <div class="search-box"><span>⌕</span><input id="feed-search" placeholder="Search Posts..." autocomplete="off">
        </div>
      </div>
    </section>
    <div class="filter-row"><button class="filter active" data-filter="all">All</button><button class="filter"
        data-filter="public">Public</button><button class="filter" data-filter="private">Private</button></div>
    <section id="feed-list" class="feed-grid">
      <div class="loading-state"><span class="spinner"></span>Loading your feed…</div>
    </section>
  </main>
  <footer class="site-footer container"><span>nullfeed</span><span>made for things left unsaid.</span></footer>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/feed.js"></script>
</body>

</html>
