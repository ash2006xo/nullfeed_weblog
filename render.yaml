services:
  - type: web
    name: nullfeed-weblog
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nullfeed-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"

databases:
  - name: nullfeed-db
    plan: free
